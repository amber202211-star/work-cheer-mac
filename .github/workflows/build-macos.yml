name: Build Mac application
on:
  push:
    branches: [main]
    paths: ['*.swift', 'Info.plist', '.github/workflows/build-macos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile universal application
        shell: bash
        run: |
          set -euo pipefail
          APP="build/上班鼓励器.app"
          mkdir -p "$APP/Contents/MacOS" dist
          for ARCH in arm64 x86_64; do
            xcrun swiftc -swift-version 5 -O -target "$ARCH-apple-macosx12.0" -framework AppKit -framework SwiftUI -framework Combine Pay.swift App.swift -o "build/WorkCheer-$ARCH"
          done
          lipo -create build/WorkCheer-arm64 build/WorkCheer-x86_64 -output "$APP/Contents/MacOS/WorkCheer"
          cp Info.plist "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/WorkCheer" --self-test
          lipo -info "$APP/Contents/MacOS/WorkCheer"
      - name: Package drag-and-drop installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -R "build/上班鼓励器.app" staging/
          ln -s /Applications staging/Applications
          printf '%s\n' '将「上班鼓励器」拖到 Applications 安装。' '支持 macOS 12 及以上，Apple 芯片和 Intel。' '这是未经过 Apple 公证的版本。首次打开如被拦截，请核实来源后在系统设置「隐私与安全性」中选择「仍要打开」。' '点击菜单栏「薪」可以显示悬浮窗、修改设置或退出。' > staging/安装说明.txt
          hdiutil create -volname WorkCheer -srcfolder staging -ov -format UDZO dist/WorkCheer-Mac.dmg
          hdiutil verify dist/WorkCheer-Mac.dmg
          ditto -c -k --sequesterRsrc --keepParent "build/上班鼓励器.app" dist/WorkCheer-Mac.zip
          shasum -a 256 dist/WorkCheer-Mac.dmg dist/WorkCheer-Mac.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WorkCheer-Mac-installer
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          printf '%s\n' 'macOS 12 及以上；同时支持 Apple 芯片和 Intel。' '' '下载 WorkCheer-Mac.dmg，打开后将「上班鼓励器」拖入 Applications。无需终端或开发工具。' '' '默认周一至周五 09:00–18:00 自动计薪，可修改工资和排班。菜单栏「薪」可恢复悬浮窗或退出。' '' '此版本使用本地临时签名，未经过 Apple 公证。首次打开如被系统拦截，请先核实下载来源，再参照 Apple 官方说明：https://support.apple.com/102445 。' '' '验证：双架构编译、计薪自检、签名完整性及 DMG 校验。桌面交互尚需实际设备验证。' > release-notes.md
          gh release create "$TAG" dist/WorkCheer-Mac.dmg dist/WorkCheer-Mac.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "上班鼓励器 Mac $TAG" --notes-file release-notes.md

